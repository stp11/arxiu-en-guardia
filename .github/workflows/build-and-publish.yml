name: Build and Publish Image

on:
  push:
    branches: ["main"]
    paths-ignore: ["frontend/**"]

permissions:
  contents: read

# A newer push supersedes this one, and finishing out of order would leave
# an older image tagged main.
concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    uses: ./.github/workflows/be-lint-and-test.yml

  publish:
    name: Publish image
    runs-on: ubuntu-24.04-arm  # Same architecture as the server
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
