name: BE Lint and Test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main"]
    paths-ignore: ["frontend/**"]

  push:
    branches: ["main"]
    paths-ignore: ["frontend/**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run flake8 --all-files
      - run: pre-commit run black --all-files
      - run: pre-commit run isort --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: en_guardia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOWED_ORIGINS: "*"
      # The migration step uses this database; pytest only reuses the server
      # and creates and drops its own.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/en_guardia"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements/local.txt

      # Same command as prod's start.sh, so alembic.ini is exercised too.
      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests with Pytest
        run: python -m pytest
