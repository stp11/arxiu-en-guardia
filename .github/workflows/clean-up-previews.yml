name: Clean Up Previews

# Cloudflare Pages keeps every preview it builds, each reachable at its own
# URL, long after the branch is gone. Once a pull request closes, merged or
# not, delete its branch's previews.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-previews:
    name: Delete previews
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global wrangler@4.151.3
      - name: Delete the branch's preview deployments
        # Unlike the default, this sets pipefail, so a failing wrangler fails
        # the step instead of handing jq nothing to match.
        shell: bash
        env:
          # Needs Cloudflare Pages: Edit on the account.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # list only returns the newest page of previews, so delete what it
          # shows and list again, until it shows none of the branch's. Other
          # branches' previews filling the whole page still hide older ones.
          while :; do
            ids=$(wrangler pages deployment list --project-name en-guardia \
              --environment preview --json \
              | jq -r --arg branch "$BRANCH" '.[] | select(.Branch == $branch) | .Id')
            [ -n "$ids" ] || break
            for id in $ids; do
              # --force, because the newest one holds the branch's alias URL
              wrangler pages deployment delete "$id" --project-name en-guardia --force
            done
          done
